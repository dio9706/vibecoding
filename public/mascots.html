<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>NEKO — 吉祥物状态展示</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:    #080810;
  --bg2:   #0e0e1c;
  --bg3:   #14142a;
  --border:#1e1e3a;
  --txt:   #c8c8e8;
  --muted: #555570;
  --orange:#ff7722;
  --green: #44cc66;
  --blue:  #44aaff;
  --red:   #ff3344;
  --yellow:#ffdd44;
  --purple:#cc66ff;
}

html{background:var(--bg);color:var(--txt);font-family:'Press Start 2P',monospace}

body{
  min-height:100vh;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(255,119,34,.07), transparent),
    linear-gradient(rgba(255,119,34,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,119,34,.025) 1px, transparent 1px);
  background-size:auto, 24px 24px, 24px 24px;
}

/* ── Header ─────────────────────────────────────── */
header{
  text-align:center;
  padding:44px 20px 8px;
}
h1{
  font-size:20px;
  color:var(--orange);
  text-shadow:0 0 24px rgba(255,119,34,.5);
  letter-spacing:3px;
  margin-bottom:10px;
}
.subtitle{font-size:7px;color:var(--muted);letter-spacing:2px}

/* ── State grid ──────────────────────────────────── */
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  max-width:860px;
  margin:40px auto 20px;
  padding:0 24px;
}

/* ── Card ────────────────────────────────────────── */
.card{
  background:var(--bg2);
  border:2px solid var(--border);
  border-radius:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 16px 20px;
  gap:14px;
  position:relative;
  transition:border-color .2s, box-shadow .2s, transform .15s;
  cursor:default;
}
.card:hover{transform:translateY(-3px)}
.card[data-state="idle"]:hover    {border-color:var(--orange);box-shadow:0 6px 28px rgba(255,119,34,.2)}
.card[data-state="waiting"]:hover {border-color:var(--yellow) ;box-shadow:0 6px 28px rgba(255,221,68,.2)}
.card[data-state="working"]:hover {border-color:var(--blue)   ;box-shadow:0 6px 28px rgba(68,170,255,.2)}
.card[data-state="thinking"]:hover{border-color:var(--purple) ;box-shadow:0 6px 28px rgba(204,102,255,.2)}
.card[data-state="happy"]:hover   {border-color:var(--green)  ;box-shadow:0 6px 28px rgba(68,204,102,.2)}
.card[data-state="error"]:hover   {border-color:var(--red)    ;box-shadow:0 6px 28px rgba(255,51,68,.2)}

.card-label{
  font-size:9px;
  letter-spacing:2px;
}
.card[data-state="idle"]     .card-label{color:var(--orange)}
.card[data-state="waiting"]  .card-label{color:var(--yellow)}
.card[data-state="working"]  .card-label{color:var(--blue)}
.card[data-state="thinking"] .card-label{color:var(--purple)}
.card[data-state="happy"]    .card-label{color:var(--green)}
.card[data-state="error"]    .card-label{color:var(--red)}

.card-sub{font-size:6px;color:var(--muted);text-align:center;line-height:2;letter-spacing:1px}

canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ── Big preview ─────────────────────────────────── */
.preview-wrap{
  text-align:center;
  padding:40px 24px 0;
}
.preview-wrap h2{font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:24px}
#bigCanvas{
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  border:2px solid var(--border);
  background:var(--bg2);
  display:block;
  margin:0 auto;
}
.state-btns{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:20px;
  padding-bottom:60px;
}
.state-btn{
  font-family:'Press Start 2P',monospace;
  font-size:7px;
  padding:8px 14px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  letter-spacing:1px;
  transition:all .15s;
  border-radius:2px;
}
.state-btn:hover,.state-btn.active{
  border-color:var(--orange);
  color:var(--orange);
  background:rgba(255,119,34,.08);
}
</style>
</head>
<body>

<header>
  <h1>NEKO</h1>
  <p class="subtitle">// 吉祥物 · 像素风 · 状态展示</p>
</header>

<!-- 6 小卡片展示 -->
<div class="grid" id="cardGrid"></div>

<!-- 大预览 + 状态切换 -->
<div class="preview-wrap">
  <h2>▶ 交互预览</h2>
  <canvas id="bigCanvas"></canvas>
  <div class="state-btns" id="stateBtns"></div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  NEKO  像素猫吉祥物渲染引擎
//  网格: 16 × 22, 每格 S px
// ═══════════════════════════════════════════════════

const S = 16; // pixel cell size (for cards)
const SB= 28; // pixel cell size (for big preview)
const W = 16; // grid width
const H = 22; // grid height

// ── 调色板 ───────────────────────────────────────
const P = {
  '.': null,
  'O': '#FF7722', // orange body main
  'o': '#CC4400', // orange dark (stripes / outline accent)
  'n': '#FFAA55', // orange light highlight
  'W': '#FFF2DC', // cream / white
  'w': '#EDD8A8', // cream shadow
  'K': '#1A0800', // near-black key
  'k': '#3A1800', // softer dark
  'B': '#6B2E00', // inner ear brown
  'P': '#FFB0A0', // pink nose
  'p': '#FF7060', // nose dark
  'G': '#44CC55', // iris green
  'g': '#227733', // pupil / dark iris
  // state-specific
  'Y': '#FFE044', // amber iris (working)
  'y': '#AA8800', // amber dark
  'X': '#FF3344', // x-eye red
  'x': '#CC1122', // x-eye dark
  '~': '#33AA44', // squint line
  'H': '#FF99CC', // blush pink
  'Z': '#88AAFF', // zzz blue
  'Q': '#FFDD00', // question yellow
  'S': '#FFFFFF', // sparkle white
  '!': '#FF6644', // sweat orange
  'T': '#00CCFF', // tear blue
};

// ── Body base (eyes & extras left as '.' to be overridden) ──
// 16 wide × 22 tall  (rows 0-21)
// row 0   = extra/fx row (floating symbols)
// rows 1-2 = ears
// rows 3-9 = head (eyes at rows 7-8, cols 3-6 LEFT, 9-12 RIGHT)
// rows 10-13 = muzzle/nose
// rows 14-17 = chest+body
// rows 18-21 = haunches+paws

const BODY = [
/* 0 */ '................', // fx row (transparent, overridden per state)
/* 1 */ '...OO....OO.....', // ear tips
/* 2 */ '..OoOO..OOoO....', // ears outer
/* 3 */ '..OBOO..OOBOo...', // inner ear dark
/* 4 */ '.OOOOOOOOOOOOOO.', // forehead top
/* 5 */ '.OoOOOOOOOOoOOO.', // stripe row
/* 6 */ '.OOOOOOOOOOOOOO.', // brow row
/* 7 */ '.OO....OO....OO.', // eye row 1  (4 eye slots L=3-6, R=9-12)
/* 8 */ '.OO....OO....OO.', // eye row 2
/* 9 */ '.OOOOOOOOOOOOOO.', // cheek row
/*10 */ '.OOOOOPpOOOOOOO.', // nose
/*11 */ '.OOOOOOOOOOOOoO.', // upper lip
/*12 */ '.OkWWWWWWWWWWkO.', // muzzle white
/*13 */ '.OOOOOOOOOOOOOO.', // chin
/*14 */ '.OkWWWWWWWWWWkO.', // chest white top
/*15 */ '.OkWWWWWWWWWWkO.', // chest white bot
/*16 */ '.OOOOOOOOOOOOOO.', // upper tummy
/*17 */ '.OoOOOOOOOOOoOO.', // lower body stripe
/*18 */ 'OOOo........oOOO', // haunch L     haunch R
/*19 */ 'OOOo........oOOO',
/*20 */ 'WWWk........kWWW', // paw L        paw R
/*21 */ 'WWwk........kWWw', // paw shadow
];

// ── Eye definitions (4 wide × 2 tall, placed at col 3+9) ──
// Each eye = [row7_4chars, row8_4chars]
const EYES = {
  open:    ['GggG','GggG'],    // normal open green
  blink:   ['kkkk','....'],    // closed flat
  halfblink:['kGgk','....'],   // half-blink
  squint:  ['k~~k','....'],    // focused squint
  wide:    ['gGGg','gGGg'],    // wide surprised
  happy:   ['....','k~~k'],    // closed happy ^.^
  sad:     ['kGgk','kk kk'],   // droopy
  error:   ['kXxk','kxXk'],    // x eyes
  wonder:  ['gGGg','kGgk'],    // one raised brow
  zz:      ['k~~k','....'],    // sleepy squint
};

// ── State definitions ─────────────────────────────
// Each state has: label, sub, color, frames array
// A frame = { eyes, fx (row 0 override 16chars), blush bool, extras fn }
// Animation cycles through frames

const STATES = {

  idle: {
    label:'IDLE', sub:'空闲待机\n自然眨眼',
    color:'#FF7722',
    fps: 8,
    // 4 frame loop: open → open → half-blink → blink
    frames: [
      {eyes:'open',    fx:'................'},
      {eyes:'open',    fx:'................'},
      {eyes:'open',    fx:'................'},
      {eyes:'open',    fx:'................'},
      {eyes:'open',    fx:'................'},
      {eyes:'open',    fx:'................'},
      {eyes:'halfblink',fx:'................'},
      {eyes:'blink',   fx:'................'},
      {eyes:'halfblink',fx:'................'},
    ],
    // subtle vertical float offset
    floatFn: (t) => Math.sin(t * 0.8) * 1.5,
  },

  waiting: {
    label:'WAITING', sub:'等待中\n左顾右盼',
    color:'#FFDD44',
    fps: 6,
    frames: [
      {eyes:'open',     fx:'................', eyeShift: 0},
      {eyes:'open',     fx:'................', eyeShift: 0},
      {eyes:'open',     fx:'................', eyeShift:-2}, // look left
      {eyes:'open',     fx:'................', eyeShift:-2},
      {eyes:'open',     fx:'................', eyeShift:-2},
      {eyes:'open',     fx:'................', eyeShift: 0},
      {eyes:'open',     fx:'................', eyeShift: 0},
      {eyes:'open',     fx:'................', eyeShift: 2}, // look right
      {eyes:'open',     fx:'................', eyeShift: 2},
      {eyes:'open',     fx:'................', eyeShift: 2},
      {eyes:'open',     fx:'................', eyeShift: 0},
      {eyes:'halfblink',fx:'................', eyeShift: 0},
      {eyes:'blink',    fx:'................', eyeShift: 0},
      {eyes:'halfblink',fx:'................', eyeShift: 0},
    ],
    floatFn: (t) => Math.sin(t * 0.4) * 0.8,
    // ZZZ dots drawn separately
    zzz: true,
  },

  working: {
    label:'WORKING', sub:'工作中\n专注模式',
    color:'#44AAFF',
    fps:10,
    frames: [
      {eyes:'squint', fx:'................', pawAnim:0},
      {eyes:'squint', fx:'................', pawAnim:0},
      {eyes:'squint', fx:'................', pawAnim:1},
      {eyes:'squint', fx:'................', pawAnim:1},
      {eyes:'squint', fx:'................', pawAnim:0},
      {eyes:'squint', fx:'................', pawAnim:0},
      {eyes:'squint', fx:'................', pawAnim:2},
      {eyes:'squint', fx:'................', pawAnim:2},
    ],
    floatFn: (t) => 0,
    amber: true,  // use amber eyes
  },

  thinking: {
    label:'THINKING', sub:'思考中\n脑袋打问号',
    color:'#CC66FF',
    fps: 6,
    frames: [
      {eyes:'open',  fx:'......Q.........', tilt:  1},
      {eyes:'open',  fx:'......Q.........', tilt:  2},
      {eyes:'open',  fx:'.......Q........', tilt:  2},
      {eyes:'wonder',fx:'.......Q........', tilt:  3},
      {eyes:'wonder',fx:'........Q.......', tilt:  3},
      {eyes:'wonder',fx:'.......Q........', tilt:  2},
      {eyes:'wonder',fx:'......Q.........', tilt:  2},
      {eyes:'open',  fx:'......Q.........', tilt:  1},
    ],
    floatFn: (t) => Math.sin(t * 1.2) * 1,
    tilt: true,
  },

  happy: {
    label:'HAPPY', sub:'任务完成\n开心跳跳',
    color:'#44CC66',
    fps: 8,
    frames: [
      {eyes:'happy', fx:'....S.......S...', bounce: 0},
      {eyes:'happy', fx:'....S.......S...', bounce: 0},
      {eyes:'happy', fx:'.....S.....S....', bounce:-2},
      {eyes:'happy', fx:'....S.......S...', bounce:-4},
      {eyes:'happy', fx:'.....S.....S....', bounce:-4},
      {eyes:'happy', fx:'....S.......S...', bounce:-2},
      {eyes:'happy', fx:'....S.......S...', bounce: 0},
      {eyes:'happy', fx:'.....S.....S....', bounce: 1},
    ],
    floatFn:(t)=>0,
    blush: true,
  },

  error: {
    label:'ERROR', sub:'出错了\n耳朵都垂了',
    color:'#FF3344',
    fps: 5,
    frames: [
      {eyes:'error', fx:'................', sweat:true},
      {eyes:'error', fx:'................', sweat:true},
      {eyes:'error', fx:'................', sweat:true},
      {eyes:'blink', fx:'................', sweat:true},
      {eyes:'error', fx:'................', sweat:true},
    ],
    floatFn:(t)=> Math.sin(t*2)*0.5,
    earDown: true,
  },
};

// ═══════════════════════════════════════════════════
//  核心绘制函数
// ═══════════════════════════════════════════════════

function drawNeko(ctx, stateKey, frameIdx, scale) {
  const state   = STATES[stateKey];
  const frames  = state.frames;
  const frame   = frames[frameIdx % frames.length];
  const px      = scale;

  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

  // timing for float
  const t = performance.now() / 1000;
  const floatY = Math.round(state.floatFn(t) || 0);

  // tilt for thinking
  const tiltDeg = frame.tilt ? frame.tilt * 3 : 0;

  // bounce for happy
  const bounceY = frame.bounce || 0;

  const totalOffY = floatY + bounceY;

  ctx.save();
  if (tiltDeg !== 0) {
    ctx.translate(ctx.canvas.width / 2, ctx.canvas.height / 2);
    ctx.rotate(tiltDeg * Math.PI / 180);
    ctx.translate(-ctx.canvas.width / 2, -ctx.canvas.height / 2);
  }

  // Build the full pixel grid for this frame
  const grid = BODY.map(r => r.split(''));

  // ── 1. Overlay eye row (rows 7-8, cols 3-6 left, 9-12 right) ──
  const eyeKey = (state.amber && frame.eyes !== 'error' && frame.eyes !== 'blink' && frame.eyes !== 'halfblink')
                  ? frame.eyes  // we'll recolor later
                  : frame.eyes;
  const eyeDef = EYES[eyeKey] || EYES.open;

  const eyeShift = frame.eyeShift || 0;

  function placeEye(row, startCol, chars) {
    for (let i = 0; i < 4; i++) {
      const col = startCol + i;
      if (col >= 0 && col < W) grid[row][col] = chars[i] || '.';
    }
  }

  // place outline pixels around eyes
  // left eye: cols 2,7 are borders (already 'O' in body)
  // right eye: cols 8,13 are borders
  placeEye(7, 3, eyeDef[0]);
  placeEye(8, 3, eyeDef[1]);
  placeEye(7, 9, eyeDef[0]);
  placeEye(8, 9, eyeDef[1]);

  // eye shift (for waiting - look left/right)
  if (eyeShift !== 0 && (frame.eyes === 'open' || frame.eyes === 'squint')) {
    // shift iris 1 col
    const sh = Math.sign(eyeShift);
    for (const row of [7,8]) {
      // left eye cols 3-6 → shift
      const le = [grid[row][3],grid[row][4],grid[row][5],grid[row][6]];
      const re = [grid[row][9],grid[row][10],grid[row][11],grid[row][12]];
      // shift content (not border chars K/k)
      const shiftArr = (arr,d) => {
        const res = ['k','k','k','k'];
        for(let i=0;i<4;i++){
          const ni = i+d;
          if(ni>=1 && ni<=2) res[ni]=arr[i];
        }
        return res;
      };
      const sle = shiftArr(le, sh);
      const sre = shiftArr(re, sh);
      for(let i=0;i<4;i++){
        grid[row][3+i] = sle[i];
        grid[row][9+i] = sre[i];
      }
    }
  }

  // ── 2. Ear down for error state ──
  if (state.earDown) {
    // flatten ears: make rows 1-3 ear pixels move down / reshape
    grid[1][3]='O'; grid[1][4]='O'; // left ear squashed
    grid[1][9]='O'; grid[1][10]='O';
    // make top of ear transparent
    grid[1][2]='.'; grid[1][11]='.';
  }

  // ── 3. Amber eyes for working ──
  if (state.amber) {
    for(const row of [7,8]) {
      for(let c=3;c<=6;c++) {
        if(grid[row][c]==='G') grid[row][c]='Y';
        if(grid[row][c]==='g') grid[row][c]='y';
        if(grid[row][c]==='~') grid[row][c]='Y';
      }
      for(let c=9;c<=12;c++) {
        if(grid[row][c]==='G') grid[row][c]='Y';
        if(grid[row][c]==='g') grid[row][c]='y';
        if(grid[row][c]==='~') grid[row][c]='Y';
      }
    }
  }

  // ── 4. FX row (row 0: Q = ?, S = sparkle, Z = zzz) ──
  if (frame.fx) {
    grid[0] = frame.fx.split('');
  }

  // ── 5. Blush cheeks for happy ──
  if (state.blush) {
    grid[9][2]  = 'H';
    grid[9][3]  = 'H';
    grid[9][12] = 'H';
    grid[9][13] = 'H';
  }

  // ── 6. Draw pixels ──
  for (let row = 0; row < H; row++) {
    for (let col = 0; col < W; col++) {
      const ch = grid[row][col];
      const color = P[ch];
      if (!color) continue;
      ctx.fillStyle = color;
      ctx.fillRect(col * px, (row + totalOffY) * px, px, px);
    }
  }

  // ── 7. Working: paw typing indicators (pixel dots below paws) ──
  if (stateKey === 'working' && frame.pawAnim !== undefined) {
    const pa = frame.pawAnim;
    const tapColor = '#88DDFF';
    ctx.fillStyle = tapColor;
    if (pa === 1) { // left paw down
      ctx.fillRect(1*px, (20+totalOffY)*px, 3*px, px);
    } else if(pa === 2) { // right paw down
      ctx.fillRect(12*px,(20+totalOffY)*px, 3*px, px);
    }
  }

  // ── 8. Sweat drop for error ──
  if (frame.sweat && stateKey === 'error') {
    const sx = 13, sy = 4;
    ctx.fillStyle = '#88CCFF';
    ctx.fillRect((sx+1)*px, (sy+totalOffY)*px,   px,   px);
    ctx.fillRect( sx*px,    (sy+1+totalOffY)*px, 2*px, px);
    ctx.fillRect( sx*px,    (sy+2+totalOffY)*px, 2*px, px);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════
//  Animation loop per canvas
// ═══════════════════════════════════════════════════
const activeAnims = new Map(); // canvasEl → {stateKey, frameIdx, lastTime, fps}

function startAnim(canvas, stateKey, scale) {
  if (activeAnims.has(canvas)) {
    const a = activeAnims.get(canvas);
    a.stateKey = stateKey;
    a.frameIdx  = 0;
    return;
  }
  const anim = {stateKey, frameIdx:0, lastTime:0};
  activeAnims.set(canvas, anim);
  const ctx = canvas.getContext('2d');

  function tick(now) {
    const a = activeAnims.get(canvas);
    if (!a) return;
    const fps = STATES[a.stateKey].fps;
    const interval = 1000 / fps;
    if (now - a.lastTime >= interval) {
      a.frameIdx++;
      a.lastTime = now;
    }
    drawNeko(ctx, a.stateKey, a.frameIdx, scale);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ═══════════════════════════════════════════════════
//  Build Cards
// ═══════════════════════════════════════════════════
const cardGrid = document.getElementById('cardGrid');

Object.entries(STATES).forEach(([key, def]) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.state = key;

  const canvas = document.createElement('canvas');
  canvas.width  = W * S;
  canvas.height = H * S;
  canvas.style.width  = W*S + 'px';
  canvas.style.height = H*S + 'px';
  card.appendChild(canvas);

  const label = document.createElement('div');
  label.className = 'card-label';
  label.textContent = def.label;
  card.appendChild(label);

  const sub = document.createElement('div');
  sub.className = 'card-sub';
  sub.textContent = def.sub;
  card.appendChild(sub);

  cardGrid.appendChild(card);
  startAnim(canvas, key, S);
});

// ═══════════════════════════════════════════════════
//  Big preview
// ═══════════════════════════════════════════════════
const bigCanvas = document.getElementById('bigCanvas');
bigCanvas.width  = W * SB;
bigCanvas.height = H * SB;
bigCanvas.style.width  = W*SB + 'px';
bigCanvas.style.height = H*SB + 'px';

let bigState = 'idle';
startAnim(bigCanvas, bigState, SB);

const stateBtnsEl = document.getElementById('stateBtns');
const stateLabels = {
  idle:'😴 IDLE 空闲', waiting:'⏳ WAITING 等待',
  working:'⌨️ WORKING 工作', thinking:'🤔 THINKING 思考',
  happy:'✨ HAPPY 完成', error:'❌ ERROR 出错'
};

Object.keys(STATES).forEach(key => {
  const btn = document.createElement('button');
  btn.className = 'state-btn' + (key === 'idle' ? ' active' : '');
  btn.textContent = stateLabels[key];
  btn.onclick = () => {
    bigState = key;
    document.querySelectorAll('.state-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const a = activeAnims.get(bigCanvas);
    if(a){ a.stateKey = key; a.frameIdx = 0; }
  };
  stateBtnsEl.appendChild(btn);
});

</script>
</body>
</html>
